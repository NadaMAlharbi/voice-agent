[project]
name = "mcp-calculator"
version = "0.1.0"
description = "Example MCP server (stdio) with one tool, add_numbers. A template for independent projects."
requires-python = ">=3.10"
dependencies = [
    # Official MCP Python SDK. 2.x renamed FastMCP to MCPServer.
    "mcp>=2.3,<3",
]

[project.scripts]
mcp-calculator = "mcp_calculator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calculator"]
