[project]
name = "mcp-notes"
version = "0.1.0"
description = "Example MCP server (stdio) with two tools: add_note and list_notes. A template for independent projects."
requires-python = ">=3.10"
dependencies = [
    # Official MCP Python SDK. 2.x renamed FastMCP to MCPServer.
    "mcp>=2.3,<3",
]

[project.scripts]
mcp-notes = "mcp_notes.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_notes"]